
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}"
><head>
    <title layout:fragment="title">Butikker</title>
    <th:block layout:fragment="page-styles">
    </th:block>
</head>
<body>
    <main layout:fragment="content">
        <div th:each="butik, stat : ${butikker}" class="info">
            <h3 th:text="${decryptedNames[stat.index]}"></h3>
            <p th:text="${butik.companyAddress}"></p>
            <a th:href="${butik.getCompanyWebsiteURL()}" th:text="${butik.companyWebsiteURL}"
            target="_blank">
            ></a>
        </div>
    </main>
</body>
</html>
